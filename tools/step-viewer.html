<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEP뷰어</title>
<link rel="icon" href="../assets/smartedge_icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f3f4f6;--panel:#fff;--ink:#1d232b;--sub:#5f6b78;--line:#dfe3e8;--acc:#c75b12;--acc2:#fbeee4;--cv:#14181f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;display:flex;flex-direction:column}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;white-space:nowrap}
header .note{flex:1;text-align:center;font-size:17px;font-weight:700}
header .note a{color:var(--acc);text-decoration:none}
header .note a:hover{text-decoration:underline}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--acc)}
button.primary,.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button[aria-pressed="true"]{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
#tabs{display:flex;gap:6px;padding:8px 16px 0;flex-wrap:wrap}
#tabs .tab{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;border-radius:8px 8px 0 0;background:#e6e9ed;cursor:pointer;max-width:260px}
#tabs .tab.on{background:var(--acc);color:#fff}
#tabs .tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tabs .tab small{opacity:.75;font-size:11px}
#tabs .tab b{font-weight:400;padding:0 4px;border-radius:4px;opacity:.7}
#tabs .tab b:hover{opacity:1;background:rgba(0,0,0,.15)}
main{flex:1;display:flex;gap:12px;padding:0 16px 16px;min-height:0}
aside{width:290px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto}
aside h3{font-size:13px;margin:14px 0 6px;color:var(--sub);font-weight:600}
aside h3:first-child{margin-top:0}
.stage{flex:1;position:relative;background:var(--cv);border-radius:10px;overflow:hidden;min-width:0}
.stage canvas{display:block;width:100%;height:100%}
#pdfWrap{position:absolute;inset:0;overflow:auto;background:#525659;text-align:center;padding:16px 0}
#pdfWrap canvas{display:block;margin:0 auto 14px;box-shadow:0 2px 10px rgba(0,0,0,.4);background:#fff;width:auto;height:auto}
.toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.toolbar>*{pointer-events:auto}
.toolbar button{background:rgba(255,255,255,.92)}
.toolbar button[aria-pressed="true"]{background:var(--acc2)}
.hint{position:absolute;left:10px;bottom:10px;color:#cfd6df;font-size:12px;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:6px;pointer-events:none}
#tip{position:absolute;pointer-events:none;background:rgba(20,24,31,.92);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cfd6df;text-align:center;gap:10px;padding:20px}
#empty b{font-size:20px;color:#fff}
.stage.drag{outline:3px dashed var(--acc);outline-offset:-8px}
table.kv{width:100%;border-collapse:collapse;font-size:13px}
table.kv td{padding:3px 0;border-bottom:1px solid #f0f2f4;vertical-align:top}
table.kv td:first-child{color:var(--sub);width:80px}
table.kv td:last-child{font-family:ui-monospace,Consolas,monospace;text-align:right}
.list{font-size:13px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:7px}
.list label{display:flex;align-items:center;gap:6px;padding:3px 8px;cursor:pointer;border-bottom:1px solid #f3f4f6}
.list label:hover{background:#fafafa}
.list label.sel{background:var(--acc2)}
.list label span.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list label i{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.2)}
.list small{color:var(--sub);font-family:ui-monospace,Consolas,monospace}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.muted{color:var(--sub);font-size:12px}
#meas{font-family:ui-monospace,Consolas,monospace;font-size:13px}
input[type=range]{width:100%}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;z-index:20}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d232b;color:#fff;padding:8px 16px;border-radius:8px;z-index:30}
@media(max-width:800px){main{flex-direction:column}aside{width:auto;max-height:40vh}.stage{min-height:60vh}header .note{display:none}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
</head>
<body>
<header>
  <h1>STEP뷰어</h1>
  <div class="note"><a href="https://cafe.naver.com/cadsolutions" target="_blank" rel="noopener">홍반장 기술노트</a></div>
  <label class="btn primary" for="fileIn">불러오기</label>
  <input type="file" id="fileIn" accept=".step,.stp,.igs,.iges,.stl,.3mf,.dxf,.dwg,.pdf" multiple hidden>
</header>
<div id="tabs"></div>
<main>
  <aside id="side">
    <h3>지원 파일</h3>
    <p class="muted" style="margin:0">STEP(.step .stp)·IGES·STL·3MF 3D 모델, DXF·DWG 도면, PDF 문서를 열 수 있습니다. 파일은 서버로 올라가지 않고 이 PC의 브라우저 안에서만 열립니다.</p>
    <p class="muted">솔리드웍스 파트·어셈블리는 솔리드웍스에서 "다른 이름으로 저장 → STEP"으로 내보낸 뒤 여세요.</p>
  </aside>
  <div class="stage" id="stage">
    <canvas id="cv3" hidden></canvas>
    <canvas id="cv2" hidden></canvas>
    <div id="pdfWrap" hidden></div>
    <div class="toolbar" id="tb"></div>
    <div class="hint" id="hint" hidden></div>
    <div id="tip" hidden></div>
    <div id="empty"><b>파일을 끌어다 놓거나 [불러오기]를 누르세요</b><span>STEP · IGES · STL · 3MF · DXF · DWG · PDF</span></div>
  </div>
</main>
<div id="busy" hidden>불러오는 중…</div>
<div id="toast" hidden></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/three/OrbitControls.js';
import { STLLoader } from './vendor/three/loaders/STLLoader.js';
import { ThreeMFLoader } from './vendor/three/loaders/3MFLoader.js';

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=v=>(Math.round(v*100)/100).toFixed(2);
let toastT=0; function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3500); }
function busy(m){ if(m){ $('busy').textContent=m; $('busy').hidden=false; } else $('busy').hidden=true; }
const loadScript=src=>new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>no(new Error(src+' 를 불러오지 못했습니다')); document.head.appendChild(s); });

const docs=[]; let cur=null;

/* ===================== file loading ===================== */
$('fileIn').addEventListener('change',e=>{ openFiles([...e.target.files]); e.target.value=''; });
const stage=$('stage');
stage.addEventListener('dragover',e=>{ e.preventDefault(); stage.classList.add('drag'); });
stage.addEventListener('dragleave',()=>stage.classList.remove('drag'));
stage.addEventListener('drop',e=>{ e.preventDefault(); stage.classList.remove('drag'); openFiles([...e.dataTransfer.files]); });

async function openFiles(files){
  for(const f of files){
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    try{
      let d;
      if(ext==='step'||ext==='stp') d=await openStep(f,'step');
      else if(ext==='igs'||ext==='iges') d=await openStep(f,'iges');
      else if(ext==='stl') d=await openStl(f);
      else if(ext==='3mf') d=await open3mf(f);
      else if(ext==='dxf') d=await openDxf(f);
      else if(ext==='dwg') d=await openDwg(f);
      else if(ext==='pdf') d=await openPdf(f);
      else if(ext==='sldprt'||ext==='sldasm'){ toast('솔리드웍스 파일은 직접 열 수 없습니다. 솔리드웍스에서 STEP으로 저장해 주세요.'); continue; }
      else { toast(f.name+': 지원하지 않는 파일입니다'); continue; }
      d.name=f.name; d.size=f.size; docs.push(d); select(d);
    }catch(err){ console.error(err); toast(f.name+' 을(를) 열지 못했습니다: '+(err.message||err)); }
    finally{ busy(); }
  }
}

function renderTabs(){
  $('tabs').innerHTML=docs.map((d,i)=>`<div class="tab${d===cur?' on':''}" data-i="${i}" title="${esc(d.name)}"><span>${esc(d.name)}</span><small>${d.kind.toUpperCase()}</small><b data-x="${i}" title="닫기">×</b></div>`).join('');
}
$('tabs').addEventListener('click',e=>{
  const x=e.target.closest('[data-x]'); if(x){ const d=docs[+x.dataset.x]; closeDoc(d); return; }
  const t=e.target.closest('.tab'); if(t) select(docs[+t.dataset.i]);
});
function closeDoc(d){ const i=docs.indexOf(d); if(i<0) return; docs.splice(i,1); if(d.dispose) d.dispose(); if(cur===d){ cur=null; select(docs[Math.min(i,docs.length-1)]||null); } else renderTabs(); }

function select(d){
  if(cur&&cur.leave) cur.leave();
  cur=d; renderTabs();
  $('cv3').hidden=$('cv2').hidden=$('pdfWrap').hidden=true; $('tb').innerHTML=''; $('hint').hidden=true; $('tip').hidden=true;
  $('empty').hidden=!!d;
  if(!d){ $('side').innerHTML='<h3>지원 파일</h3><p class="muted" style="margin:0">STEP · IGES · STL · 3MF · DXF · DWG · PDF 파일을 불러오세요.</p>'; return; }
  d.enter();
}

/* ===================== STEP (OpenCascade, occt-import-js) ===================== */
let occt=null;
async function getOcct(){ if(occt) return occt; busy('STEP 해석기 불러오는 중… (처음 한 번, 약 7MB)');
  await loadScript('vendor/occt/occt-import-js.js');
  occt=await window.occtimportjs({locateFile:p=>'vendor/occt/'+p}); return occt; }

let R3=null; // shared three.js renderer
function three(){
  if(R3) return R3;
  const cv=$('cv3'); const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true}); renderer.localClippingEnabled=true;
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  const camera=new THREE.PerspectiveCamera(40,1,0.1,1e7);
  const controls=new OrbitControls(camera,cv); controls.enableDamping=true; controls.dampingFactor=0.15; controls.screenSpacePanning=true;
  R3={renderer,camera,controls,scene:null,cv};
  const resize=()=>{ const r=stage.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/Math.max(1,r.height); camera.updateProjectionMatrix(); };
  new ResizeObserver(resize).observe(stage); resize();
  const loop=()=>{ requestAnimationFrame(loop); if(!$('cv3').hidden&&R3.scene){ controls.update(); renderer.render(R3.scene,camera); } }; loop();
  return R3;
}
const ACI_FACE=0xb8c2cf;

async function openStep(file,fmt){
  const lib=await getOcct(); busy((fmt==='iges'?'IGES':'STEP')+' 해석 중…');
  const buf=new Uint8Array(await file.arrayBuffer());
  await new Promise(r=>setTimeout(r,30));
  const prm={linearUnit:'millimeter',linearDeflectionType:'bounding_box_ratio',linearDeflection:0.001,angularDeflection:0.5};
  const res=fmt==='iges'?lib.ReadIgesFile(buf,prm):lib.ReadStepFile(buf,prm);
  if(!res||!res.success) throw new Error('파일을 해석하지 못했습니다');
  const list=res.meshes.map((m,i)=>{ const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(m.attributes.position.array,3));
    if(m.attributes.normal) g.setAttribute('normal',new THREE.Float32BufferAttribute(m.attributes.normal.array,3));
    if(m.index) g.setIndex(new THREE.Uint32BufferAttribute(m.index.array,1));
    if(!m.attributes.normal) g.computeVertexNormals();
    return {geometry:g,color:m.color?new THREE.Color(m.color[0],m.color[1],m.color[2]):null,name:m.name||('면 묶음 '+(i+1))}; });
  const nodes=[]; const walk=(n,depth)=>{ const own=(n.meshes||[]).slice(); const item={name:n.name||(depth===0?'(전체)':'(이름 없음)'),depth,own,all:[]};
    nodes.push(item); for(const c of n.children||[]) item.all.push(...walk(c,depth+1)); item.all.push(...own); return item.all; };
  walk(res.root,0);
  return build3D(list,nodes,fmt);
}
async function openStl(file){ busy('STL 읽는 중…'); const g=new STLLoader().parse(await file.arrayBuffer()); if(!g.attributes.normal) g.computeVertexNormals();
  const col=g.hasColors?null:null; const nm=file.name.replace(/\.[^.]+$/,'');
  return build3D([{geometry:g,color:null,name:nm}],[{name:nm,depth:0,own:[0],all:[0]}],'stl'); }
async function open3mf(file){ busy('3MF 읽는 중…'); const grp=new ThreeMFLoader().parse(await file.arrayBuffer()); grp.updateMatrixWorld(true);
  const list=[]; const nodes=[]; const walk=(o,depth)=>{ const item={name:o.name||(o.isMesh?'부품':'(묶음)'),depth,own:[],all:[]};
    if(o!==grp) nodes.push(item);
    if(o.isMesh){ const g=o.geometry.clone(); g.applyMatrix4(o.matrixWorld); if(!g.attributes.normal) g.computeVertexNormals();
      const mc=Array.isArray(o.material)?o.material[0]:o.material; list.push({geometry:g,color:mc&&mc.color&&!(mc.color.r===1&&mc.color.g===1&&mc.color.b===1)?mc.color.clone():null,name:item.name}); item.own.push(list.length-1); }
    for(const c of o.children) item.all.push(...walk(c,o===grp?0:depth+1)); item.all.push(...item.own); return item.all; };
  walk(grp,0); if(!list.length) throw new Error('3MF 안에서 모델을 찾지 못했습니다');
  // 3MF is Z-up like STEP; the group itself may carry a Y-up rotation from the loader, which applyMatrix4 already baked in, so undo it
  return build3D(list,nodes.length?nodes:[{name:file.name,depth:0,own:list.map((_,i)=>i),all:list.map((_,i)=>i)}],'3mf',false); }
function build3D(list,nodes,fmt,yUpBaked){
  const scene=new THREE.Scene(); scene.background=new THREE.Color(0x1b2028);
  scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1.1)); const dl=new THREE.DirectionalLight(0xffffff,1.6); dl.position.set(1,1.5,2); scene.add(dl);
  const dl2=new THREE.DirectionalLight(0xffffff,0.6); dl2.position.set(-1,-0.5,-1); scene.add(dl2);
  // models are Z-up; show them Z-up
  const root=new THREE.Group(); if(!yUpBaked) root.rotation.x=-Math.PI/2; scene.add(root);
  const clip=[new THREE.Plane(new THREE.Vector3(-1,0,0),1e9)];
  const meshes=list.map(m=>{ const col=m.color||new THREE.Color(ACI_FACE);
    const mat=new THREE.MeshStandardMaterial({color:col,metalness:0.1,roughness:0.6,side:THREE.DoubleSide,clippingPlanes:clip,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
    const mesh=new THREE.Mesh(m.geometry,mat);
    const edges=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,25),new THREE.LineBasicMaterial({color:0x111111,clippingPlanes:clip}));
    mesh.add(edges); root.add(mesh); return {mesh,edges,name:m.name}; });
  root.updateMatrixWorld(true);
  const parts=nodes.filter(n=>n.own.length);
  const box=new THREE.Box3().setFromObject(root);
  const d={kind:fmt,is3d:true,scene,root,meshes,nodes,parts,box,clip,sel:null,wire:false,section:null,measure:false,mpts:[],mobj:[]};
  d.bboxHelper=new THREE.Box3Helper(box,0xffc83d); scene.add(d.bboxHelper);
  d.enter=()=>enterStep(d); d.leave=()=>{ d.cam={p:R3.camera.position.clone(),t:R3.controls.target.clone()}; };
  d.dispose=()=>{ meshes.forEach(m=>{m.mesh.geometry.dispose(); m.mesh.material.dispose(); m.edges.geometry.dispose();}); };
  return d;
}
function sizeOfBox(b){ return [b.max.x-b.min.x,b.max.y-b.min.y,b.max.z-b.min.z]; }
// world box (Y-up) -> STEP axes (Z-up): X=x, Y=-z, Z=y
function stepDims(b){ const s=sizeOfBox(b); return {X:s[0],Y:s[2],Z:s[1]}; }
function fitView(d,dir){
  const {camera,controls}=R3; const b=d.box, c=b.getCenter(new THREE.Vector3()), r=Math.max(1e-3,b.getSize(new THREE.Vector3()).length()/2);
  const v={iso:[1,0.8,1.2],front:[0,0,1],top:[0,1,0.0001],right:[1,0,0],back:[0,0,-1],bottom:[0,-1,0.0001],left:[-1,0,0]}[dir||'iso'];
  const n=new THREE.Vector3(...v).normalize(); const dist=r/Math.sin(camera.fov*Math.PI/360)*1.05;
  camera.position.copy(c).addScaledVector(n,dist); camera.near=dist/1000; camera.far=dist*100; camera.updateProjectionMatrix();
  camera.up.set(0,1,0); controls.target.copy(c); controls.update();
}
function enterStep(d){
  const r=three(); r.scene=d.scene; $('cv3').hidden=false;
  if(d.cam){ r.camera.position.copy(d.cam.p); r.controls.target.copy(d.cam.t); } else fitView(d,'iso');
  const S=stepDims(d.box);
  $('tb').innerHTML=`<button data-v="iso">등각</button><button data-v="front">정면</button><button data-v="top">윗면</button><button data-v="right">우측면</button>
    <button id="wireB" aria-pressed="${d.wire}">와이어</button><button id="bbB" aria-pressed="${d.bboxHelper.visible}">외형 박스</button><button id="mB" aria-pressed="${d.measure}">거리 재기</button>`;
  $('tb').onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.v) fitView(d,b.dataset.v);
    else if(b.id==='wireB'){ d.wire=!d.wire; d.meshes.forEach(m=>{m.mesh.material.wireframe=d.wire; m.edges.visible=!d.wire;}); b.setAttribute('aria-pressed',d.wire); }
    else if(b.id==='bbB'){ d.bboxHelper.visible=!d.bboxHelper.visible; b.setAttribute('aria-pressed',d.bboxHelper.visible); }
    else if(b.id==='mB'){ d.measure=!d.measure; b.setAttribute('aria-pressed',d.measure); if(!d.measure) clearMeasure3(d); setHint(d); }
  };
  const tri=d.meshes.reduce((a,m)=>a+(m.mesh.geometry.index?m.mesh.geometry.index.count/3:0),0);
  $('side').innerHTML=`<h3>외형 치수 (mm)</h3>
    <table class="kv"><tr><td>가로 X</td><td>${f2(S.X)}</td></tr><tr><td>세로 Y</td><td>${f2(S.Y)}</td></tr><tr><td>높이 Z</td><td>${f2(S.Z)}</td></tr></table>
    <h3>선택한 부품</h3><div id="selInfo" class="muted">목록이나 화면에서 부품을 클릭하세요.</div>
    <h3>거리 재기</h3><div id="meas" class="muted">[거리 재기]를 켜고 두 점을 클릭하세요.</div>
    <h3>단면 보기</h3>
    <div class="row"><button data-sec="">끄기</button><button data-sec="x">X</button><button data-sec="y">Y</button><button data-sec="z">Z</button><button data-sec="flip" title="잘리는 쪽 바꾸기">반대쪽</button></div>
    <input type="range" id="secR" min="0" max="1000" value="500" ${d.section?'':'disabled'}>
    <h3>부품 목록 (${d.parts.length})</h3>
    <div class="row" style="margin-bottom:6px"><button id="allOn">모두 보기</button><button id="allOff">모두 숨기기</button></div>
    <div class="list" id="plist">${d.nodes.map((n,i)=>`<label data-n="${i}" style="padding-left:${8+n.depth*14}px"><input type="checkbox" checked data-c="${i}"><span class="nm" title="${esc(n.name)}">${esc(n.name)}</span>${n.own.length?'':`<small>${n.all.length}</small>`}</label>`).join('')}</div>
    <h3>파일</h3><table class="kv"><tr><td>파일 크기</td><td>${(d.size/1024).toFixed(0)} KB</td></tr><tr><td>면 묶음</td><td>${d.meshes.length}</td></tr><tr><td>삼각형</td><td>${Math.round(tri).toLocaleString()}</td></tr></table>`;
  $('plist').onchange=e=>{ const i=+e.target.dataset.c; const n=d.nodes[i]; const on=e.target.checked; for(const k of n.all) d.meshes[k].mesh.visible=on;
    // keep child checkboxes in step
    for(let j=i+1;j<d.nodes.length&&d.nodes[j].depth>n.depth;j++) $('plist').querySelector(`[data-c="${j}"]`).checked=on; };
  $('plist').onclick=e=>{ if(e.target.tagName==='INPUT') return; const l=e.target.closest('label'); if(!l) return; e.preventDefault(); selectNode(d,+l.dataset.n); };

        const xs=uniq([x0,...holes.map(c=>c.x),x1]); if(xs.length>2) for(let i=0;i+1<xs.length;i++) dimLin(xs[i],xs[i+1],'x',{from:y1,pos:y1+off1,side:i===0?-1:i+2===xs.length?1:0});
        const ys=uniq([y0,...holes.map(c=>c.y),y1]); if(ys.length>2) for(let i=0;i+1<ys.length;i++) dimLin(ys[i],ys[i+1],'y',{from:x1,pos:x1+off1,side:i===0?-1:i+2===ys.length?1:0}); }
      const groups=new Map(); for(const c of holes){ const k=(Math.round(c.r*200)/100).toFixed(2); (groups.get(k)||groups.set(k,[]).get(k)).push(c); }
      const co=[];
      for(const [k,cs] of groups){ const txt=(cs.length>1?cs.length+'×':'')+'Ø'+fmtN(+k); let hit=null;
        for(const c of cs){ hit=co.find(o=>Math.hypot(o.c.x-c.x,o.c.y-c.y)<eps); if(hit) break; }
        if(hit){ hit.lines.push(txt); const m=cs.find(c=>Math.hypot(hit.c.x-c.x,hit.c.y-c.y)<eps); if(m&&m.r>hit.c.r) hit.c={...hit.c,r:m.r}; }
        else co.push({c:cs.reduce((a,b)=>(b.x+b.y<a.x+a.y?b:a)),lines:[txt]}); }
      co.forEach((o,gi)=>{ const c=o.c, ang=Math.PI/4+gi*0.35;
        const ex=[c.x+c.r*Math.cos(ang),c.y+c.r*Math.sin(ang)], kn=[c.x+(c.r+h*1.8)*Math.cos(ang),c.y+(c.r+h*1.8)*Math.sin(ang)+(o.lines.length-1)*h*1.4], tail=[kn[0]+h*1.2,kn[1]];
        L([ex,kn,tail]); arrow(ex,[Math.cos(ang),Math.sin(ang)]); o.lines.forEach((t,i)=>T(tail[0]+h*0.2,tail[1]+h*0.15-i*h*1.4,t,0,7)); }); }
    if(!part) continue;
    // 3) fillets (arcs) and chamfers (45° short edges) of this view
    const arcsIn=(d.arcs||[]).filter(a=>on.get(a.layer)&&inB(a.mid)&&inV(a.mid)&&a.r>=0.3&&a.r<=Math.min(W,H)*0.2&&(a.sw==null||a.sw<=Math.PI*0.56)&&!d.circles.some(c=>Math.abs(c.x-a.x)<eps&&Math.abs(c.y-a.y)<eps&&Math.abs(c.r-a.r)<eps)); nF+=arcsIn.length;
    const rg=new Map(); for(const a of arcsIn){ const k=fmtN(a.r); (rg.get(k)||rg.set(k,[]).get(k)).push(a); }
    for(const [k,as] of rg){ const a=as[0]; const ux=(a.mid[0]-a.x)/(a.r||1), uy=(a.mid[1]-a.y)/(a.r||1); const kn=[a.mid[0]+ux*h*1.8,a.mid[1]+uy*h*1.8], tail=[kn[0]+(ux>=0?h*1.2:-h*1.2),kn[1]];
      L([a.mid,kn,tail]); arrow(a.mid,[ux,uy]); T(ux>=0?tail[0]+h*0.2:tail[0]-h*0.2-h*0.6*((as.length>1?3:0)+1+k.length),tail[1]+h*0.15,(as.length>1?as.length+'×':'')+'R'+k,0,7); }
    const chams=(d.segs||[]).filter(([p,q,l])=>{ if(!on.get(l)||!inB(p)||!inB(q)||!inV(p)||!inV(q)) return false; const dx=q[0]-p[0], dy=q[1]-p[1], len=Math.hypot(dx,dy); if(len<=1e-6||len>Math.min(W,H)*0.25||len/Math.SQRT2<Math.max(0.3,Math.max(W,H)*0.005)) return false;
        const ang=Math.abs(Math.atan2(dy,dx)*180/Math.PI)%90; return Math.abs(ang-45)<1.5; }); nC+=chams.length;
    const cg=new Map(); for(const [p,q] of chams){ const k=fmtN(Math.abs(q[0]-p[0])); (cg.get(k)||cg.set(k,[]).get(k)).push([p,q]); }
    for(const [k,cs] of cg){ const [p,q]=cs[0]; const m=[(p[0]+q[0])/2,(p[1]+q[1])/2]; const cx=(x0+x1)/2, cy=(y0+y1)/2; const ux=Math.sign(m[0]-cx)||1, uy=Math.sign(m[1]-cy)||1;
      const kn=[m[0]+ux*h*1.4,m[1]+uy*h*1.4], tail=[kn[0]+ux*h*1.2,kn[1]]; L([m,kn,tail]); arrow(m,[ux/Math.SQRT2,uy/Math.SQRT2]);
      T(ux>0?tail[0]+h*0.2:tail[0]-h*0.2-h*0.6*(1+k.length+(cs.length>1?3:0)),tail[1]+h*0.15,(cs.length>1?cs.length+'×':'')+'C'+k,0,7); } }
  d.items.push(...out); d.layers.push({name:AD,col:4,on:true,count:out.length});
  d.hideDim=true; for(const l of d.layers) if(l.name!==AD&&/dim|치수/i.test(l.name)){ if(l.on) (d.dimOff||(d.dimOff=[])).push(l.name); l.on=false; }
  enter2D(d);
  const v0=views.slice().sort((a,b)=>(b.x1-b.x0)*(b.y1-b.y0)-(a.x1-a.x0)*(a.y1-a.y0))[0];
  toast(`자동 치수(${part?'단품':'완제품'}): 부품 뷰 ${views.length}개${frames?' (도면틀 제외)':''}, 주 뷰 ${fmtN(v0.x1-v0.x0)} × ${fmtN(v0.y1-v0.y0)}, 홀 ${nH}개${part?`, 필렛 ${nF}곳, 모따기 ${nC}곳`:''}. [DXF 저장]에 함께 들어갑니다.`);
}

/* ===================== PDF ===================== */
let pdfjs=null;
async function getPdf(){ if(pdfjs) return pdfjs; busy('PDF 읽기 도구 불러오는 중…'); await loadScript('vendor/pdfjs/pdf.min.js'); pdfjs=window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc='vendor/pdfjs/pdf.worker.min.js'; return pdfjs; }
async function openPdf(file){ const lib=await getPdf(); busy('PDF 여는 중…'); const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const p1=await doc.getPage(1); const vp=p1.getViewport({scale:1});
  const d={kind:'pdf',doc,pages:doc.numPages,zoom:0,w:vp.width,h:vp.height}; d.enter=()=>enterPdf(d); d.leave=()=>{ d.scroll=$('pdfWrap').scrollTop; }; d.dispose=()=>doc.destroy(); return d; }
async function renderPdf(d){ const wrap=$('pdfWrap'); wrap.innerHTML=''; const token=d.tok=(d.tok||0)+1;
  const fitW=(wrap.clientWidth-40)/d.w; const scale=d.zoom||fitW; d.scale=scale; $('zoomV')&&($('zoomV').textContent=Math.round(scale*100*72/96)+'%');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  for(let i=1;i<=d.pages;i++){ if(token!==d.tok) return; const pg=await d.doc.getPage(i); const vp=pg.getViewport({scale}); const c=document.createElement('canvas');
    c.width=Math.floor(vp.width*dpr); c.height=Math.floor(vp.height*dpr); c.style.width=Math.floor(vp.width)+'px'; c.style.height=Math.floor(vp.height)+'px'; wrap.appendChild(c);
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise; }
  if(d.scroll!=null){ wrap.scrollTop=d.scroll; d.scroll=null; } }
async function toVector(d){ let pg=1; if(d.pages>1){ const v=parseInt(prompt(`몇 쪽을 도면으로 바꿀까요? (1~${d.pages})`,'1'),10); if(!(v>=1&&v<=d.pages)) return; pg=v; }
  try{ busy('PDF 선을 뽑는 중…'); const dd=await pdfToDrawing(d,pg); dd.name=d.name.replace(/\.pdf$/i,'')+(d.pages>1?` ${pg}쪽`:'')+' (도면)'; dd.size=d.size; docs.push(dd); select(dd);
    toast(`선 ${dd.items.filter(i=>i.k==='p').length}개, 글자 ${dd.items.filter(i=>i.k==='t').length}개를 뽑았습니다. [축척 맞추기]로 실제 치수를 맞추세요.`); }
  catch(err){ console.error(err); toast(err.message||String(err)); } finally{ busy(); } }
function enterPdf(d){ $('pdfWrap').hidden=false;
  $('tb').innerHTML=`<button id="zOut">－</button><button id="zFit">폭 맞춤</button><button id="zIn">＋</button><button id="zV" disabled><span id="zoomV"></span></button><button id="vecB" title="CAD에서 만든 PDF의 선과 글자를 도면으로 바꿔 축척을 맞추고 DXF로 저장합니다">도면으로 바꾸기 (DXF)</button>`;
  $('tb').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; const base=d.scale||1; if(b.id==='zIn') d.zoom=base*1.25; if(b.id==='zOut') d.zoom=base/1.25; if(b.id==='zFit') d.zoom=0; if(b.id==='vecB'){ toVector(d); return; } renderPdf(d); };
  $('side').innerHTML=`<h3>PDF</h3><table class="kv"><tr><td>쪽 수</td><td>${d.pages}</td></tr><tr><td>1쪽 크기</td><td>${f2(d.w*25.4/72)} × ${f2(d.h*25.4/72)} mm</td></tr><tr><td>파일 크기</td><td>${(d.size/1024).toFixed(0)} KB</td></tr></table>
    <h3>도면으로 바꾸기</h3>
    <p class="muted" style="margin:0">CAD에서 내보낸 PDF는 선과 글자를 뽑아 도면으로 바꿀 수 있습니다. 바꾼 뒤 [축척 맞추기]로 치수선 하나의 두 끝을 찍고 실제 치수를 넣으면 전체 크기가 맞춰지고, [DXF 저장]으로 내려받습니다. 스캔한 그림 PDF는 선 정보가 없어 바꿀 수 없습니다.</p>
    ${d.pages>1?`<p class="muted">여러 쪽이면 바꿀 쪽 번호를 묻습니다.</p>`:''}`;
  renderPdf(d); }
